name: Pages
# FairMedFM is now published at https://fairmedfm.github.io/FairMedFM/ from the FairMedFM/FairMedFM repository.
# This site only redirects the old URLs there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      urls: ${{ steps.build.outputs.urls }}
      indexnow_key: ${{ steps.build.outputs.indexnow_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: build
        run: |
          mkdir _site
          python scripts/redirects.py _site > urls.txt
          echo "urls=$(python -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))' < urls.txt)" >> "$GITHUB_OUTPUT"
          echo "indexnow_key=$(ls verification | sed -n 's/^\([0-9a-f]\{32\}\)\.txt$/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing and other IndexNow engines that the old URLs changed, so they pick up the redirects.
      - name: Submit the redirected pages to IndexNow
        if: needs.build.outputs.indexnow_key != ''
        continue-on-error: true
        env:
          URLS: ${{ needs.build.outputs.urls }}
          KEY: ${{ needs.build.outputs.indexnow_key }}
        run: |
          payload=$(python3 -c 'import json,os; k=os.environ["KEY"]; print(json.dumps({"host": "nanboy-ronan.github.io", "key": k, "keyLocation": f"https://nanboy-ronan.github.io/FairMedFM-page/{k}.txt", "urlList": json.loads(os.environ["URLS"])}))')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" -d "$payload"
